name: Frontend Tests

on:
  push:
    branches: [ main, develop, feature/* ]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install dependencies
      run: |
        cd frontend
        npm ci
    
    - name: Run linter
      run: |
        cd frontend
        npm run lint -- --max-warnings=0 || echo "Linting issues found but continuing..."
      continue-on-error: true
    
    - name: Run tests
      run: |
        cd frontend
        npm run test -- --passWithNoTests
      env:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    
    - name: Build
      run: |
        cd frontend
        npm run build
      env:
        NEXT_PUBLIC_API_URL: http://localhost:8000
