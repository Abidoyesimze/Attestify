paths-ignore:
  - "**/node_modules/**"
  - "**/staticfiles/**"
  - "**/__pycache__/**"
  - "**/.next/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/*.lock"
  - "**/package-lock.json"
  - "**/yarn.lock"
  - "**/poetry.lock"
  - "**/Pipfile.lock"
  - "**/test/**"
  - "**/tests/**"
  - "**/__tests__/**"
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/migrations/**"
  - "**/artifacts/**"
  - "**/cache/**"

matches-ignore:
  - name: Django test secret key
    match: django-insecure-dev-key-change-in-production
  - name: Django insecure key pattern
    match: django-insecure-.*
  - name: Test passwords
    match: testpass123
  - name: Example API keys
    match: your-.*-key|your-.*-api-key
  - name: Placeholder secrets
    match: your-secret-key|your-email-password|your-private-key
  - name: CI test keys
    match: test-secret-key-for-ci
